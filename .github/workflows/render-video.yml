name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID to render"
        required: true
        default: "TaskDropDemo"
      quality:
        description: "Video Quality / CRF (lower is higher quality, default: 18)"
        required: false
        default: "18"
  push:
    branches:
      - main
    paths:
      - "src/remotion/**"
      - ".github/workflows/render-video.yml"

permissions:
  contents: write

jobs:
  render:
    name: Render Demo Video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "22"
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Create output directory
        run: mkdir -p out

      - name: Render Thumbnail Image (Still Frame)
        run: |
          vp exec remotion still src/remotion/index.ts ${{ github.event.inputs.composition || 'TaskDropDemo' }} out/thumbnail.png --frame=320

      - name: Render Video MP4
        run: |
          vp exec remotion render src/remotion/index.ts ${{ github.event.inputs.composition || 'TaskDropDemo' }} out/taskdrop-demo.mp4 --crf=${{ github.event.inputs.quality || '18' }} --gl=angle

      - name: Upload Video & Thumbnail Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taskdrop-demo-video
          path: |
            out/taskdrop-demo.mp4
            out/thumbnail.png
          retention-days: 14
